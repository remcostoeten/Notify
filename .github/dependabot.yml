version: 2
updates:
    - package-ecosystem: 'npm'
      directory: '/'
      schedule:
          interval: 'weekly'
      groups:
          dev-dependencies:
              patterns:
                  - '@types/*'
                  - 'eslint*'
                  - 'prettier*'
                  - 'typescript'
          production-dependencies:
              patterns:
                  - 'react*'
                  - 'next*'
                  - 'framer-motion'
      ignore:
          - dependency-name: 'typescript'
            update-types: ['version-update:semver-major']

    - package-ecosystem: 'npm'
      directory: '/packages/notifier'
      schedule:
          interval: 'weekly'
      ignore:
          - dependency-name: 'typescript'
            update-types: ['version-update:semver-major']

    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: 'monthly'
